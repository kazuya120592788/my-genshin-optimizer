name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# PRはビルド確認のみなので新しいpushで古い実行を止める。
# Pagesへのデプロイは途中で止めると不整合になり得るため、キャンセルせず順番に実行する。
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # サブモジュール(ゲームデータ)は生成済みファイルがコミットされているためビルドには不要
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'yarn'
      - name: Yarn install
        run: yarn install --immutable --immutable-cache
        env:
          # E2Eテスト用のCypress本体はビルドに不要なのでダウンロードしない
          CYPRESS_INSTALL_BINARY: 0
      - name: Build frontend
        run: yarn run nx run frontend:build:production
        env:
          NX_URL_GITHUB_GO: ${{ github.server_url }}/${{ github.repository }}
          NX_URL_GITHUB_GO_CURRENT_VERSION: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'dist/apps/frontend'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
